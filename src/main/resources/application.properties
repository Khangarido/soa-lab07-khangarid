# =============================================
# File Manager Service - Тохиргоо
# АНХААР: Нууц мэдээлэл энд шууд бичигдэхгүй!
# Бүгдийг environment variable-аар дамжуулна
# =============================================

server.port=8080

# --- DigitalOcean Spaces тохиргоо ---
spaces.access-key=${S3_ACCESS_KEY}
spaces.secret-key=${S3_SECRET_KEY}
spaces.bucket-name=${S3_BUCKET_NAME}
spaces.region=${S3_REGION:sgp1}
spaces.endpoint=https://${S3_REGION:sgp1}.digitaloceanspaces.com

# --- SOAP Service холболт ---
soap.service.url=${SOAP_SERVICE_URL:http://localhost:8081/UserService}

# --- Файлын хязгаар ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Log тохиргоо ---
logging.level.com.soa.filemanager=INFO
logging.level.com.amazonaws=WARN
